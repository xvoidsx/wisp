# release.yml
name: release
run-name: "wisp release ${{ inputs.version || 'auto' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0). Leave empty to auto-bump patch."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4.6.0
        with:
          ref: dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build wisp
        run: ./packages/opencode/script/build.ts
        env:
          WISP_VERSION: ${{ inputs.version || '0.1.0' }}

      - name: Package
        run: |
          # Find the built binary and package it
          bin=$(find packages/opencode/dist -name "wisp-*" -type d | grep "${{ matrix.target }}" | head -1)
          # Fallback: opencode names its output dirs opencode-<platform>
          if [[ -z "$bin" ]]; then
            bin=$(find packages/opencode/dist -name "opencode-*" -type d | grep "${{ matrix.target }}" | head -1)
          fi
          if [[ -z "$bin" ]]; then
            echo "No build output found for ${{ matrix.target }}"
            ls packages/opencode/dist/
            exit 1
          fi
          # Rename the binary inside to wisp
          if [[ -f "$bin/bin/opencode" ]]; then
            mv "$bin/bin/opencode" "$bin/bin/wisp"
          fi
          tar -czf "wisp-${{ matrix.target }}.tar.gz" -C "$(dirname $bin)" "$(basename $bin)"
          ls -lh "wisp-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: wisp-${{ matrix.target }}
          path: wisp-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version || '0.1.0' }}
          name: wisp v${{ inputs.version || '0.1.0' }}
          body: |
            ✦ wisp — your navi code agent.

            A fork of opencode, tuned for the navi way of working.
            nightshadeNeon theme, Ollama local by default, reads navi's agents.env.

            Install:
            ```
            curl -fsSL https://raw.githubusercontent.com/xvoidsx/wisp/dev/install.sh | bash
            ```
          files: artifacts/wisp-*.tar.gz
          draft: false
          prerelease: false
